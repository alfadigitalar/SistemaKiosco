<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kubo Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* === HEADER === */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .status-badge::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
        }

        .connected {
            background: rgba(16,185,129,0.15);
            color: #34d399;
        }
        .connected::before {
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
        }

        .disconnected {
            background: rgba(239,68,68,0.15);
            color: #f87171;
        }
        .disconnected::before {
            background: #ef4444;
            box-shadow: 0 0 6px #ef4444;
        }

        /* === SCANNER AREA (flex-grow para llenar espacio disponible) === */
        .scanner-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            min-height: 0; /* Necesario para que flex-shrink funcione */
            position: relative;
        }

        #scanner-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            max-height: 100%; /* No puede crecer más que el área disponible */
            border-radius: 24px;
            overflow: hidden;
            background: #0f172a;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 16px 40px rgba(0,0,0,0.6);
        }

        #reader {
            width: 100%;
            height: 100%;
        }

        /* Ocultar branding de la librería */
        #reader a { display: none !important; }

        /* Flash dentro del scanner, esquina inferior derecha */
        #overlayFlash {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 48px; height: 48px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            padding: 0;
            transition: all 0.2s;
        }

        #overlayFlash svg {
            width: 22px; height: 22px;
            fill: currentColor;
        }

        #overlayFlash:active { transform: scale(0.9); }

        #overlayFlash.active {
            background: #fbbf24;
            border-color: #fbbf24;
            color: #000;
            box-shadow: 0 0 20px rgba(251,191,36,0.4);
        }

        /* === BOTTOM SECTION === */
        .bottom-section {
            flex-shrink: 0;
            padding: 12px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .last-scan-container {
            background: rgba(30,41,59,0.5);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 12px 16px;
            text-align: center;
            transition: all 0.3s;
        }

        .last-scan-container.success-flash {
            background: rgba(16,185,129,0.15);
            border-color: rgba(16,185,129,0.3);
        }

        .last-scan-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .last-scan-value {
            font-size: 1.25rem;
            font-weight: 700;
            word-break: break-all;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.primary-btn {
            padding: 14px 24px;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 6px 16px rgba(37,99,235,0.3);
        }

        button.primary-btn:active {
            transform: scale(0.96);
        }

        button.primary-btn:disabled {
            background: #334155;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        #debug-log {
            font-family: monospace;
            font-size: 0.7rem;
            color: #ef4444;
            text-align: left;
            word-wrap: break-word;
            white-space: pre-wrap;
            max-height: 80px;
            overflow-y: auto;
        }

        /* Safe area para iPhone con notch */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .bottom-section {
                padding-bottom: calc(12px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Kubo Scanner</h1>
        <div id="status" class="status-badge disconnected">Conectando...</div>
    </div>

    <div class="scanner-area">
        <div id="scanner-wrapper">
            <div id="reader"></div>
            <button id="overlayFlash" title="Toggle Flash">
                <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7v7l9-11h-7V3z"/></svg>
            </button>
        </div>
    </div>

    <div class="bottom-section">
        <div class="last-scan-container" id="scanContainer">
            <div class="last-scan-label">Último Código</div>
            <div id="lastScan" class="last-scan-value">--</div>
        </div>
        <button id="startButton" class="primary-btn">Iniciar Cámara</button>
        <div id="debug-log"></div>
    </div>

    <script>
        // =============================================
        // LÓGICA ORIGINAL INTACTA - NO MODIFICAR
        // =============================================
        const socket = io();
        const statusEl = document.getElementById('status');
        const lastScanEl = document.getElementById('lastScan');
        const scanContainer = document.getElementById('scanContainer');
        const startBtn = document.getElementById('startButton');
        const flashBtn = document.getElementById('overlayFlash');
        const debugLogEl = document.getElementById('debug-log');
        let html5QrCode;

        function logError(msg) {
            debugLogEl.textContent += `> ${msg}\n`;
            console.error(msg);
        }

        // Socket Events
        socket.on('connect', () => {
            statusEl.textContent = "Conectado al POS";
            statusEl.className = "status-badge connected";
        });

        socket.on('disconnect', () => {
            statusEl.textContent = "Desconectado";
            statusEl.className = "status-badge disconnected";
        });

        socket.on('connect_error', (err) => {
            logError("Socket Error: " + err.message);
        });

        let lastScanTimestamp = 0;
        const SCAN_COOLDOWN_MS = 2500;

        // Custom Audio File
        const beepSound = new Audio('beep.mp3');

        // Desbloquear audio en móviles
        function unlockAudio() {
            beepSound.play().then(() => {
                beepSound.pause();
                beepSound.currentTime = 0;
            }).catch(e => console.log("Audio unlock attempted", e));
        }

        function beep() {
            beepSound.currentTime = 0;
            beepSound.play().catch(e => console.error("Beep error:", e));
        }

        // Camera Logic
        function onScanSuccess(decodedText, decodedResult) {
            const now = Date.now();
            if (now - lastScanTimestamp < SCAN_COOLDOWN_MS) {
                return;
            }
            lastScanTimestamp = now;

            beep();
            lastScanEl.textContent = "PROCESANDO...";
            lastScanEl.style.color = "#fbbf24";
            scanContainer.classList.add('success-flash');

            socket.emit('scan', decodedText);

            setTimeout(() => {
                lastScanEl.textContent = decodedText;
                lastScanEl.style.color = "#4ade80";
                scanContainer.classList.remove('success-flash');
            }, 600);
        }

        startBtn.addEventListener('click', async () => {
            unlockAudio();

            startBtn.disabled = true;
            startBtn.innerText = "Iniciando...";

            try {
                if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                    logError("ADVERTENCIA: No estás en HTTPS. Algunos navegadores bloquean la cámara.");
                }

                html5QrCode = new Html5Qrcode("reader");

                // Configuración optimizada para lectura fácil de códigos de barras
                const config = {
                    fps: 15,
                    qrbox: { width: 280, height: 180 },
                    aspectRatio: 1.0
                };

                const devices = await Html5Qrcode.getCameras();
                if (devices && devices.length) {
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        config,
                        onScanSuccess
                    );

                    startBtn.style.display = 'none';
                    debugLogEl.style.display = 'none';

                    // Flash Button
                    flashBtn.style.display = 'flex';
                    let isFlashOn = false;

                    const newFlashBtn = flashBtn.cloneNode(true);
                    flashBtn.parentNode.replaceChild(newFlashBtn, flashBtn);
                    const currentFlashBtn = document.getElementById('overlayFlash');

                    currentFlashBtn.addEventListener('click', async () => {
                        try {
                            const videoEl = document.querySelector("#reader video");
                            if (!videoEl || !videoEl.srcObject) {
                                throw new Error("No se encontró el video del scanner.");
                            }

                            const stream = videoEl.srcObject;
                            const track = stream.getVideoTracks()[0];

                            if (!track) {
                                throw new Error("No hay track de video activo.");
                            }

                            isFlashOn = !isFlashOn;

                            await track.applyConstraints({
                                advanced: [{ torch: isFlashOn }]
                            });

                            if (isFlashOn) currentFlashBtn.classList.add('active');
                            else currentFlashBtn.classList.remove('active');

                        } catch (err) {
                            logError("Error Flash: " + err);
                        }
                    });

                } else {
                    logError("No se detectaron cámaras.");
                    startBtn.disabled = false;
                    startBtn.innerText = "Reintentar";
                }

            } catch (err) {
                logError("Error CRÍTICO: " + err);
                startBtn.disabled = false;
                startBtn.innerText = "Iniciar Cámara";

                if (err.toString().includes("Permission")) {
                    alert("Por favor permite el acceso a la cámara.");
                } else if (err.toString().includes("Secure Context")) {
                    alert("Error: El navegador bloqueó la cámara por no usar HTTPS. Intenta usar Firefox o configura 'Insecure origins treated as secure' en chrome://flags.");
                }
            }
        });

    </script>
</body>

</html>
